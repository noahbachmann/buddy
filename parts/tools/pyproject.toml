[project]
name = "cad"
version = "0.1.0"
description = "Build, render, check and sweep parametric OpenSCAD parts"
requires-python = ">=3.12"
dependencies = [
  "trimesh>=4.5",
  "manifold3d>=3.0",
  "pyvista>=0.44",
  "numpy>=2.0",
  "scipy>=1.14",
  "rtree>=1.3",
  "shapely>=2.0",
  "networkx>=3.3",   # trimesh sections → polygons
  "matplotlib>=3.9",
  "pillow>=11.0",
]

[project.scripts]
cad = "cad.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

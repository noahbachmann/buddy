[project]
name = "cad"
version = "0.1.0"
description = "Build, render, check and sweep parametric OpenSCAD parts"
requires-python = ">=3.12"
dependencies = [
  "trimesh>=4.5",
  "manifold3d>=3.0",
  "pyvista>=0.44",
  "numpy>=2.0",
  "scipy>=1.14",
  "rtree>=1.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false   # CLI package lands with `cad build` (#54 step 2)

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
  <title>Buddy</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='6' width='24' height='20' rx='7' fill='%23e8a33d'/%3E%3Ccircle cx='12' cy='16' r='3' fill='%2314161a'/%3E%3Ccircle cx='20' cy='16' r='3' fill='%2314161a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Buddy</h1>
    <div id="services" class="services" aria-label="Services"></div>
    <span id="link" class="link" title="Connection to Buddy">connecting…</span>
  </header>

  <main>
    <nav class="tabs" aria-label="Pages">
      <a href="#" id="tab-dashboard">Dashboard</a>
      <a href="#hue" id="tab-hue">Hue</a>
    </nav>

    <div id="page-dashboard">
    <section aria-labelledby="lights-title">
      <div class="section-head">
        <h2 id="lights-title">Lights</h2>
        <span id="bridge" class="muted"></span>
      </div>
      <div id="rooms" class="rooms"></div>
    </section>

    <section aria-labelledby="music-title">
      <div class="section-head">
        <h2 id="music-title">Music</h2>
        <span id="music-note" class="muted"></span>
      </div>
      <div id="music" class="card music"></div>
    </section>
    </div>

    <!-- static form: re-renders on every state update would drop focus and typed text -->
    <div id="page-hue" hidden>
    <section aria-labelledby="new-scene-title">
      <div class="section-head">
        <h2 id="new-scene-title">New scene</h2>
        <span class="muted">set the lights, then save them as they are</span>
      </div>
      <div class="card">
        <select id="scene-group" class="field" aria-label="Room or zone"></select>
        <div id="scene-lights" class="lights"></div>
        <form id="scene-form" class="row scene-form">
          <input id="scene-name" class="field" maxlength="32" placeholder="Scene name" aria-label="Scene name" autocomplete="off" required>
          <button class="text-btn primary" type="submit">Save</button>
        </form>
      </div>
    </section>

    <section aria-labelledby="scenes-title">
      <div class="section-head">
        <h2 id="scenes-title">Scenes</h2>
        <span class="muted">tap one to load it for editing</span>
      </div>
      <div id="scene-list" class="card"></div>
    </section>
    </div>
  </main>

  <button id="customize" class="cog" aria-label="Arrange rooms" title="Arrange rooms" aria-pressed="false">⚙</button>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>

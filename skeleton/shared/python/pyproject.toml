[project]
name = "buddy-shared"
version = "0.1.0"
description = "Python side of skeleton/shared: topics, MQTT wrapper, config, systemd notify"
requires-python = ">=3.12"  # VM/PC 3.12 (Ubuntu 24.04), Pi 3.13 (Debian 13)
dependencies = ["paho-mqtt>=2.1,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["buddy_shared"]

# topics.json lives one level up (shared with CMake): ship it inside the package
[tool.hatch.build.targets.wheel.force-include]
"../topics.json" = "buddy_shared/topics.json"

# uv workspace for every Python package in the skeleton (D15). C++ builds with CMake; this file is Python only.
#   uv sync --all-packages --extra cpu    VM: everything, CPU PyTorch (`--extra cuda` on the PC with the GPU)
#   uv run pytest           all Python tests
# On the Pi, deploy.sh installs only the deployed Python services (`uv sync --package …`) into ~/buddy/venv.
# Explicit list (uv needs a pyproject.toml in every match): a new Python service is added here, like a C++ one to
# CMakeLists.txt.
[tool.uv.workspace]
members = ["shared/python", "tools/voice"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["shared/python/tests", "tools"]

# PyTorch comes from its own index: CUDA 12.8 wheels (any NVIDIA GPU from the last ~10 years, driver ≥ 570) or CPU.
[tool.uv]
conflicts = [[{ package = "buddy-voice", extra = "cpu" }, { package = "buddy-voice", extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# Buddy's PipeWire additions (D20). `setup.sh audio` installs this to ~/.config/pipewire/pipewire.conf.d/ and
# restarts PipeWire when it changed. Edit it here, then run deploy/deploy.sh --setup.
#
#   Soloist ──► buddy_music ──► the Nest that plays (Bluetooth), never the Jabra
#   voice ────► buddy_voice ──► that Nest while music plays there, else the Jabra
#
# Two virtual sinks, so the speakers service can move, mute and duck music and voice without touching Soloist or
# voice: it moves the *.output streams to a sink and sets the buddy_* volumes. The default sink stays the Jabra.
context.modules = [
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Buddy music"
            capture.props = {
                node.name = "buddy_music"
                media.class = "Audio/Sink"
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name = "buddy_music.output"
                # don't keep a sink awake while Soloist is silent
                node.passive = true
                # WirePlumber never links it: speakers links it to the Nest with pw-link, and when the Nest goes away
                # the link goes with it, so music can't end up on the Jabra. (A missing target.object with
                # node.dont-fallback or node.dont-reconnect makes WirePlumber destroy the stream, and the sink with it.)
                node.autoconnect = false
                # fixed port names for pw-link (output_FL/FR); unlinked, nothing else would negotiate them
                audio.position = [ FL FR ]
            }
        }
    }
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Buddy voice"
            capture.props = {
                node.name = "buddy_voice"
                media.class = "Audio/Sink"
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name = "buddy_voice.output"
                node.passive = true
            }
        }
    }
]

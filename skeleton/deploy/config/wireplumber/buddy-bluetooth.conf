# Bluetooth speakers (D20). `setup.sh audio` installs this to ~/.config/wireplumber/wireplumber.conf.d/.
wireplumber.profiles = {
  main = {
    # Headless Pi: no logind seat session, so WirePlumber would never start its Bluetooth monitor
    monitor.bluez.seat-monitoring = disabled
  }
}

monitor.bluez.properties = {
  # Plain SBC: Dev compared it with SBC-XQ on the Nest Audio by ear and kept SBC
  bluez5.codecs = [ sbc ]
}

monitor.bluez.rules = [
  {
    # A connected Nest must never become the default sink: the default stays the Jabra (voice, other programs)
    matches = [ { node.name = "~bluez_output.*" } ]
    actions = { update-props = { priority.session = 100, priority.driver = 100 } }
  }
]

# Buddy's WirePlumber additions (1.11). deploy/pi/setup.sh (step audio) installs this to ~/.config/wireplumber/wireplumber.conf.d/
# and restarts PipeWire when it changed.
#
# Bigger ALSA buffers for USB audio. Echo cancellation links mic (Jabra: 16 kHz only) and speaker (48 kHz) into one
# graph with one clock; with the default buffers the speaker XRUNs on the first cycle and never recovers
# ("snd_pcm_avail after recover: Broken pipe"): no sound at all, though everything shows RUNNING.
# Costs ~20 ms latency; irrelevant for a voice assistant.
monitor.alsa.rules = [
    {   matches = [ { node.name = "~alsa_(input|output).usb-.*" } ]
        actions = { update-props = { api.alsa.period-size = 1024, api.alsa.headroom = 1024 } }
    }
]

# Buddy's PipeWire additions (1.11). setup-pi.sh installs this to ~/.config/pipewire/pipewire.conf.d/
# and restarts PipeWire when it changed. Edit it here, then run deploy/deploy.sh --setup.
#
#   Jabra mic ──► echo-cancel ──► buddy_aec_source ──► ears          (BUDDY_EARS_DEVICE=pipewire:NODE=buddy_aec_source)
#                     ▲ reference: everything the Jabra plays (monitor of the default sink)
#   Soloist ──► buddy_music ──► Jabra speaker ◄── voice              (mixer turns buddy_music down = ducking)
#
# The defaults stay the Jabra: other programs (pw-record, speaker-test) are not affected.
context.modules = [
    # Echo cancellation: removes Buddy's own playback (music, replies) from the microphone, so the wake word
    # is heard over music. WebRTC's AEC, the one browsers use for video calls.
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            # Reference = monitor of the default sink (the Jabra), so nothing has to play into a special sink
            monitor.mode = true
            # The Jabra mic is mono; one channel also halves the work
            audio.channels = 1
            audio.position = [ MONO ]
            aec.args = {
                # Defaults of PipeWire 1.4, written out to make tuning easy. ⚠️ noise suppression helps against
                # fan hum and leftover music, but may cost wake word score: try false if scores drop.
                webrtc.high_pass_filter = true
                webrtc.noise_suppression = true
                webrtc.voice_detection = true
                webrtc.extended_filter = true
                webrtc.delay_agnostic = true
                # Off: automatic gain would change your loudness relative to the background (ears' level gate)
                webrtc.gain_control = false
            }
            capture.props = {
                node.name = "buddy_aec_capture"
            }
            source.props = {
                node.name = "buddy_aec_source"
                node.description = "Buddy mic (echo-cancelled)"
            }
            sink.props = {
                node.name = "buddy_aec_reference"
            }
        }
    }
    # Virtual sink for music. Soloist plays into it (PULSE_SINK in buddy-soloist.service), it plays into the
    # default sink. Its volume is the ducking knob; Spotify's own volume stays untouched.
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Buddy music"
            capture.props = {
                node.name = "buddy_music"
                media.class = "Audio/Sink"
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name = "buddy_music.output"
                node.passive = true
            }
        }
    }
]

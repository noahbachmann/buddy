[project]
name = "buddy-voice"
version = "0.1.0"
description = "Voice data and speech-to-text training for Buddy (runs on the PC, see docs/voice-training.md)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "soundfile>=0.13",
    "onnxruntime>=1.22",          # Silero VAD for trimming clips, like ears
    # Pinned exactly: train.py runs Whisper's encoder with a short audio context and relies on its internals
    "transformers==5.19.0",
]

[project.optional-dependencies]
# Pick one: `uv sync --extra cuda` on the PC with the NVIDIA GPU, `--extra cpu` elsewhere (smoke tests only)
cpu = ["torch>=2.11"]
cuda = ["torch>=2.11"]

[project.scripts]
buddy-voice = "buddy_voice.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["buddy_voice"]

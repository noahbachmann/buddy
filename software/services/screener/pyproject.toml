[project]
name = "buddy-screener"
version = "0.1.0"
description = "Screens chats in a social app on a dedicated Android phone over adb (#66)"
requires-python = ">=3.12"
dependencies = [
    "buddy-shared",
    "pillow>=11",     # screenshot crops: photo hashes, JPEG crops for the decision calls
    "claude-agent-sdk>=0.2.182",   # decisions on Dev's plan; the wheel bundles the CLI (aarch64 too, no Node)
]

[project.scripts]
buddy-screener = "buddy_screener.main:main"

[tool.uv.sources]
buddy-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["buddy_screener"]
